# corpus-catalog.yaml
# Corpus catalog for the WatchfulAnvil test harness (issue #42).
# Each test set binds a corpus project, a rule pack, a governance file, and an expected outcome source.
# The harness reads this file to drive build → pack → analyze → evaluate runs.
#
# Schema: version 0.1.0
# Governed by: https://github.com/rpapub/WatchfulAnvil (issue #42)

version: "0.1.0"

# Default governance file applied to all test sets unless overridden.
# Path is relative to this catalog file.
defaultGovernance: governance/cpmf-default.yaml

# Version of the rule pack to inject into project.json before running uipcli.
# "latest" = use the version produced by the most recent dotnet pack in the current run.
defaultRulePackVersion: latest

testSets:

  # ─────────────────────────────────────────────────────────────────────────────
  # c25v001 — legacy representative corpus
  # These projects were created before the c26 rule-targeted corpus.
  # They contain a mix of violations; expected outcomes are defined in sidecar files.
  # ─────────────────────────────────────────────────────────────────────────────

  - id: c25-core-0001
    name: "c25v001_CORE_00000001 — minimal project, assorted violations"
    corpus: ./c25v001_CORE_00000001
    rulePack: Cpmf.WorkflowAnalyzerRules
    uipathTarget: net8
    expressionLanguage: VisualBasic
    outputType: Process
    expectedSource: sidecar
    enabled: true
    tags: [cpmf, c25, smoke]

