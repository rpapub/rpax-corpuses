  # ─────────────────────────────────────────────────────────────────────────────
  # Diagnostics — the @tap developer aid.
  # The only test set that does not use Cpmf.WorkflowAnalyzerRules, and the reason
  # the harness now honours the rulePack field per test set rather than assuming it.
  # It needs its own policy too: the diagnostics rules are deliberately absent from
  # the corpus policy, which governs what the production rules assert.
  # ─────────────────────────────────────────────────────────────────────────────

  - id: c26v001_TAP_00000001
